[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"


[[mgr.prepend_keymap]]
on = ["u","L"]
run = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on = ["u", "u"]
run = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on = ["u", "U"]
run = "plugin restore -- --interactive"
desc = "Restore deleted files/folders (Interactive)"

[[mgr.prepend_keymap]]
on = ["u", "O"]
run = "plugin restore -- --interactive --interactive-overwrite"
desc = "Restore with overwrite"

