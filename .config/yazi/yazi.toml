[mgr]
show_hidden = false
show_symlink = true

[opener]
app_image = [
    { run = 'chmod +x %s && %s', orphan = true, desc = "AppImage", for = "unix" }
]
pdff = [
    { run = 'zathura "$@"', orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    { url = "*.AppImage", use = "app_image" },
    { url = "*.appimage", use = "app_image" },
    { mime = "application/pdf", use = "pdff" }
]
