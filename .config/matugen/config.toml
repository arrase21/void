[templates.mango]
input_path = '~/.config/matugen/templates/mango-colors.conf'
output_path = '~/.config/mango/colors.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/mango/rofi/matugen/colors-rofi.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/matugen-waybar.css'
output_path = '~/.config/mango/waybar/matugen/matugen-waybar.css'

[templates.starship]
input_path = '~/.config/matugen/templates/starship-colors.toml'
