# reload config
bind=SUPER+Alt,r,reload_config

#custom app bind
bind=SUPER,q,killclient,
bind=SUPER,Return,spawn, foot
bind=SUPER,w,spawn,zen
bind=Alt+SUPER,Return,spawn,foot -e yazi
bind=Super,s,spawn,swaync-client -t

#Binds
# bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
# bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
# bind=SUPER,comma,spawn,noctalia msg settings-toggle
# bind=SUPER,m,spawn,noctalia msg notification-show summary
# bind=Super+ALT,l,spawn, noctalia msg session lock
