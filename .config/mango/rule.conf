# Reglas de ventana para el scratchpad power-term
windowrule=isfloating:1,isfullscreen:0,width:420,height:600,offsetx:0,offsety:0,appid:power-term
windowrule=animation_type_open:fade_in,animation_duration_open:200,appid:power-term

# Reglas de ventana para el scratchpad bluethooth
windowrule=isfloating:1,isfullscreen:0,width:620,height:600,offsetx:0,offsety:0,appid:blue-term
windowrule=animation_type_open:fade_in,animation_duration_open:200,appid:blue-term

# Reglas de ventana para el scratchpad otter
windowrule=isfloating:1,isfullscreen:0,width:350,height:200,offsetx:0,offsety:0,appid:otter
windowrule=animation_type_open:fade_in,animation_duration_open:200,appid:otter


