# Effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.0

shadows = 1
layer_shadows = 0
shadow_only_floating=0
shadows_size = 4
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadows_color= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide 
layer_animation_type_open=slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fade_in_begin_opacity=0.6
fade_out_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=250
animation_duration_close=50
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=0
scroller_default_proportion=1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
title_message_bar_height=0

# Master-Stack Layout Setting
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1
center_master_overspread=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=1
# adaptive_sync=0
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1

# inhibit_regardless_of_visibility=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
exchange_cross_monitor=1
scratchpad_cross_monitor=1
focus_cross_tag=0
view_current_to_back=1
# circle_layout=spiral,scroller
enable_floating_snap=1
snap_distance=10
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=0
single_scratchpad = 0

# keyboard
repeat_rate=35
repeat_delay=250
numlock_on=1
xkb_rules_layout=us,ru,es
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0

# Appearance
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

scratchpad_width_ratio=1
scratchpad_height_ratio=1
border_px=2
root_color=0x222222ff
border_color=0x222222ff
focus_color=0xab93cfFF
# maxmizescreencolor=0x8424e3ff
urgent_color=0x951fadff
scratchpad_color=0xb993c4ff
global_color=0xb993c4ff
overlay_color=0xb993c4ff

# sub config load
source=./env.conf
source=./bind.conf
source=./rule.conf
source= ~/.config/mango/colors.conf
exec_once=~/.config/mango/autostart.sh

exec_once=noctalia
