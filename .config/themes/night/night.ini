[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.96
foreground=CBE0F0
background=011423

selection-background=033259
selection-foreground=CBE0F0

regular0=214969
regular1=E51E2E
regular2=44FFB1
regular3=FFE073
regular4=0FC5ED
regular5=a277ff
regular6=24EAF7
regular7=24EAF7
bright0=214969
bright1=E52E2E
bright2=44FFB1
bright3=FFE073
bright4=A277FF
bright5=a277ff
bright6=24EAF7
bright7=24EAF7
