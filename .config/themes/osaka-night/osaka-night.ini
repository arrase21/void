[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.96
background = 111c18
foreground = C1C497
cursor = D7C995 C1C497

regular0 = 23372B
regular1 = FF5345
regular2 = 549e6a
regular3 = 459451
regular4 = 509475
regular5 = D2689C
regular6 = 2DD5B7
regular7 = F6F5DD

bright0 = 53685B
bright1 = db9f9c
bright2 = 63b07a
bright3 = E5C736
bright4 = ACD4CF
bright5 = 75bbb3
bright6 = 8CD3CB
bright7 = 9eebb3
