[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0


[colors-dark]
alpha=0.96
foreground=cdd6f4
background=1e1e2e

selection-foreground=1e1e2e
selection-background=f5e0dc

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=a6adc8

bright0=585b70
bright1=f37799
bright2=89d88b
bright3=ebd391
bright4=74a8fc
bright5=f2aede
bright6=6bd7ca
bright7=bac2de
