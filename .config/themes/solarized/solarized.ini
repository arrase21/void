[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.97
background=031219
foreground=91a8aa

regular0=002831
regular1=f86265
regular2=94b109
regular3=d49a0a
regular4=529ef9
regular5=f8579a
regular6=32b9aa
regular7=f0ebdc
bright0=6e8b95
bright1=fb5c41
bright2=6e8b95
bright3=7895a0
bright4=91a8aa
bright5=8987d3
bright6=9fb2b2
bright7=fdf7e7
