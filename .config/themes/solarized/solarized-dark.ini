[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.97
background=#031219
foreground=708284
regular0=002831
regular1=d11c24
regular2=738a05
regular3=a57706
regular4=2176c7
regular5=c61c6f
regular6=259286
regular7=eae3cb
bright0=475b62
bright1=bd3613
bright2=475b62
bright3=536870
bright4=708284
bright5=5956ba
bright6=819090
bright7=fcf4dc
