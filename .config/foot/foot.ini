[main]
term=foot
shell=/bin/fish
font=PlemolJP35 Console NF Medium:style=Italic:size=11

[cursor]
style=beam
blink=no
beam-thickness=1

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Alt+c
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[colors-dark]
alpha=0.97
background=1d2021
foreground=d4be98

regular0=282828
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98

bright0=5a534c
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=ddc7a1

